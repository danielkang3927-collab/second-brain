<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="sb-build" content="19">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: https://books.google.com; connect-src 'self' https://www.googleapis.com https://docs.googleapis.com https://api.anthropic.com https://generativelanguage.googleapis.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>세컨브레인</title>
<link rel="icon" type="image/png" href="icons/icon-192.png?v=19">
<link rel="apple-touch-icon" href="icons/icon-180.png?v=19">
<link rel="manifest" href="manifest.json?v=19">
<meta name="apple-mobile-web-app-title" content="세컨브레인">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161d" media="(prefers-color-scheme: dark)">
<style>
/* 종이, 먹, 책등(남색), 가름끈(붉은색). 성경 본문은 명조, 나머지는 고딕. */
:root{
  --paper:#ffffff; --wash:#f3f5f8; --ink:#1c2430; --muted:#5b6677; --rule:#dde2ea;
  --spine:#23395b; --on-spine:#ffffff; --ribbon:#a6283a;
  --l1:#c9d3e3; --l2:#8fa3c4; --l3:#56719f; --l4:#23395b;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --serif:"AppleMyungjo","Noto Serif KR","Noto Serif CJK KR","Nanum Myeongjo","Batang",serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#12161d; --wash:#1a2029; --ink:#e7eaf0; --muted:#9aa6b8; --rule:#2a3340;
    --spine:#9db8e8; --on-spine:#10192a; --ribbon:#e58794;
    --l1:#26344b; --l2:#3d5884; --l3:#6488c4; --l4:#9db8e8;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--sans);word-break:keep-all;overflow-wrap:anywhere}
h1,h2,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--spine);text-underline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--ribbon);outline-offset:2px}

.head{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto;padding:10px 16px;min-height:52px}
.top h1{flex:1;min-width:0;font-size:1.125rem;font-weight:700;letter-spacing:-.01em}
.top .ver{background:none;border:0;padding:8px 0 8px 8px;color:var(--muted);font-size:.8125rem;white-space:nowrap}
.top .back{min-height:36px;padding:0 10px 0 6px}
.top .back::before{content:"‹";margin-right:4px;font-size:1.2em;line-height:1}
.bar{display:flex;align-items:center;gap:8px;max-width:640px;margin:0 auto;padding:8px 16px;background:var(--spine);color:var(--on-spine);font-size:.9375rem}
.bar span{flex:1;min-width:0}
.bar.bad{background:var(--ribbon);color:#fff}
.bar .b{background:transparent;border-color:currentColor;color:inherit;white-space:nowrap}

.wrap{max-width:640px;margin:0 auto;padding:4px 16px calc(84px + env(safe-area-inset-bottom))}
.sec{padding:20px 0;border-bottom:1px solid var(--rule)}
.sec:last-child{border-bottom:0}
.sec > h2{font-size:1.25rem;font-weight:700;letter-spacing:-.02em;margin-bottom:12px}
.sec > p{margin-bottom:12px}
.muted{color:var(--muted);font-size:.9375rem}
.warn{color:var(--ribbon);font-weight:600}
.when{color:var(--muted);font-size:.9375rem;padding:14px 0 6px}
.foot{padding:16px 0 4px;font-size:.9375rem}
.done{color:var(--spine);font-weight:600;padding:10px 0}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.fld{display:block;font-size:.8125rem;color:var(--muted);margin-bottom:12px}
.row .fld{margin-bottom:0}
.fld input,.fld select,.fld textarea,.findrow input,.copy{display:block;width:100%;margin-top:4px;font:inherit;font-size:1rem;color:var(--ink);background:var(--wash);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;min-height:44px}
.fld textarea,.copy{line-height:1.6;resize:vertical}
.fld select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 19px,calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.findrow{display:flex;gap:8px;margin-bottom:10px}
.findrow input{margin-top:0;flex:1;min-width:0}

.b{min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);font-weight:600}
.b.pri{background:var(--spine);border-color:var(--spine);color:var(--on-spine)}
.b.wide{display:block;width:100%}
.b.inl{min-height:32px;padding:0 10px;font-size:.875rem}
.b:disabled,.b.busy{opacity:.55}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:.875rem;color:var(--ink)}

.items li + li{border-top:1px solid var(--rule)}
.item{display:flex;flex-direction:column;align-items:flex-start;width:100%;background:none;border:0;padding:12px 0;text-align:left}
.item b{font-size:1.0625rem}
.item span{color:var(--muted);font-size:.875rem}

/* 준비 단계: 책등처럼 한 줄에 꿰어 있다 */
.spine{position:relative;padding-bottom:4px}
.spine::before{content:"";position:absolute;left:15px;top:14px;bottom:18px;width:2px;background:var(--spine)}
.sh{position:relative;display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:8px 0;text-align:left;min-height:48px}
.node{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--paper);border:2px solid var(--spine);color:var(--spine);font-weight:700;font-size:.9375rem}
.step.has .node{background:var(--spine);color:var(--on-spine)}
.step.open .node{background:var(--ribbon);border-color:var(--ribbon);color:#fff}
.st{flex:1;font-size:1.0625rem;font-weight:600}
.step.open .st{font-weight:700}
.cnt{color:var(--muted);font-size:.8125rem}
.sb{margin-left:15px;padding:2px 0 22px 29px}
.guide{color:var(--muted);font-size:.9375rem;margin-bottom:8px}
.pts{margin:0 0 14px;font-size:.875rem;color:var(--ink)}
.pts summary{cursor:pointer;color:var(--spine);font-weight:600;min-height:32px;display:flex;align-items:center;list-style:none}
.pts summary::-webkit-details-marker{display:none}
.pts summary::before{content:"▸";margin-right:6px}
.pts[open] summary::before{content:"▾"}
.pts ul{margin:6px 0 4px 1.1em;padding:0}
.pts li{margin:3px 0;line-height:1.55}
.pts .srcdocs{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:2px}
.pts .src{color:var(--muted);font-size:.8125rem;margin-top:4px}

.segs{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:14px}
.seg{flex:1;min-height:36px;background:var(--paper);border:0;border-left:1px solid var(--rule);font-size:.875rem;color:var(--muted)}
.seg:first-child{border-left:0}
.seg.on{background:var(--wash);color:var(--ink);font-weight:700}
.scripture{margin-bottom:14px}
.v{font-family:var(--serif);font-size:1.0625rem;line-height:1.95;margin-bottom:.3em}
.v b{font:700 .72em var(--sans);color:var(--ribbon);margin-right:.55em;vertical-align:.18em}
.v2{color:var(--muted);font-size:1rem;margin:-.2em 0 .8em;padding-left:1.25em}
.vh{font-size:.875rem;font-weight:700;color:var(--muted);margin:1.3em 0 .5em}
.vh:first-child{margin-top:0}

.lh{font-size:.875rem;font-weight:700;color:var(--muted);margin:16px 0 4px}
.links li{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--rule)}
.links li:first-child{border-top:0}
.links a,.links .lk{flex:1;min-width:0}
.lk{background:none;border:0;padding:0;text-align:left;color:var(--spine);text-decoration:underline;text-underline-offset:3px}
.ex,.kept{flex:none;color:var(--muted);font-size:.8125rem}
.kept{font-weight:700;color:var(--spine)}
.logos{margin:14px 0}
.logos .muted{margin-top:8px}
.copy{margin-top:10px;font-size:.875rem}
.aibox{margin:12px 0;padding:12px;border:1px solid var(--rule);border-radius:8px}
.say{margin:8px 0;padding:10px 12px;border-radius:8px;background:var(--wash);line-height:1.6}
.say.me{background:transparent;border:1px solid var(--rule)}
.say b{display:block;font-size:.8125rem;margin-bottom:2px}
.memos{margin:16px 0;border-left:2px solid var(--ribbon);padding-left:12px}
.memos li{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:.9375rem}
.memos .mt{flex:1;min-width:0}
.memos .lk{font-size:inherit}
.ed,.rm{flex:none;background:none;border:0;padding:2px 0 2px 6px;color:var(--muted);font-size:.8125rem}
.memos li.editing{display:block}
.memos li.editing textarea{display:block;width:100%;font:inherit;color:var(--ink);background:var(--wash);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;margin-bottom:8px;line-height:1.6}
.fld textarea.write{min-height:40vh;field-sizing:content}
.next{display:flex;justify-content:flex-end;margin-top:14px}

/* 자료 읽기 */
.reader{padding:18px 0 8px;font-size:1.0625rem;line-height:1.85}
.reader h2{font-size:1.375rem;line-height:1.35;letter-spacing:-.02em;margin:0 0 14px}
.reader h3{font-size:1.125rem;margin:26px 0 8px}
.reader h4{font-size:1rem;margin:20px 0 6px;color:var(--muted)}
.reader p{margin:0 0 .9em}
.reader ul,.reader ol{margin:0 0 1em;padding-left:1.3em}
.reader ul{list-style:disc}.reader ol{list-style:decimal}
.reader li{margin-bottom:.35em}
.reader blockquote{margin:0 0 1em;padding-left:12px;border-left:2px solid var(--rule);color:var(--muted)}
.reader hr{border:0;border-top:1px solid var(--rule);margin:22px 0}
.reader .lk{font-size:inherit}
.tbl{overflow-x:auto;margin:0 0 1em}
.tbl table{border-collapse:collapse;font-size:.9375rem;min-width:100%}
.tbl th,.tbl td{border:1px solid var(--rule);padding:6px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--wash);font-weight:700}
.keepbar{position:sticky;bottom:calc(60px + env(safe-area-inset-bottom));padding:10px 0;background:var(--paper);border-top:1px solid var(--rule)}

/* 원어 */
.ov{padding:10px 0 12px;border-top:1px solid var(--rule)}
.ov:first-child{border-top:0;padding-top:0}
.ov.hit{box-shadow:inset 3px 0 0 var(--ribbon);padding-left:10px}
.okr{font-size:.875rem;color:var(--muted);margin-bottom:6px}
.okr b{color:var(--ribbon);font-size:.8125rem;margin-right:.5em}
.ow{display:flex;flex-wrap:wrap;gap:4px 3px}
.w{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:1px solid transparent;border-radius:6px;padding:3px 5px;max-width:100%}
.w.on{border-color:var(--ribbon);background:var(--wash)}
.w.alt .ws{color:var(--muted)}
.ws{font-size:1.25rem;line-height:1.45;color:var(--ink)}
.g .ws{font-family:"Gentium Plus","SBL Greek","Times New Roman","Noto Serif",serif}
.h .ws{font-family:"SBL Hebrew","Ezra SIL","Arial Hebrew","Noto Serif Hebrew","Noto Sans Hebrew","Times New Roman",serif;font-size:1.5rem;line-height:1.6}
.wg{font-size:.6875rem;line-height:1.25;color:var(--muted);max-width:9.5em;text-align:center}
.wp{margin-top:10px;padding:12px;border:1px solid var(--rule);border-radius:8px;background:var(--wash)}
.wp p{margin:0 0 6px}
.wh{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.wbig{font-size:1.625rem;line-height:1.3}
.wtr{flex:1;color:var(--muted);font-size:.9375rem}
.wctx{font-size:.9375rem}
.wpart{padding:8px 0;border-top:1px solid var(--rule)}
.wpart b{font-size:1.125rem}
.wno{margin-left:8px;color:var(--muted);font-size:.8125rem}
.wm{font-size:.9375rem}
.lex{white-space:pre-wrap;font-size:.9375rem;line-height:1.65;padding:8px 0;border-top:1px solid var(--rule)}
.wuse{font-weight:700;margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.wp .chips{margin:8px 0}
.wp .b.wide{margin-top:10px}
.src{font-size:.75rem;margin-top:10px}

/* 나의 현황 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{border:1px solid var(--rule);border-radius:8px;padding:6px 0 7px;text-align:center}
.day.today{border-color:var(--ribbon);box-shadow:inset 0 0 0 1px var(--ribbon)}
.wd{display:block;font-size:.75rem;color:var(--muted)}
.day.today .wd{color:var(--ribbon);font-weight:700}
.marks{display:grid;grid-template-columns:repeat(2,18px);gap:2px;justify-content:center;margin-top:5px}
.mk{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;font-style:normal;font-size:.6875rem;line-height:1;color:var(--rule);background:var(--wash)}
.mk.on{background:var(--spine);color:var(--on-spine);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:14px;font-size:.875rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.streak{margin-top:14px}
.streak b{font-size:1.5rem;color:var(--ribbon);margin-right:2px}
.g12{display:grid;grid-template-columns:28px repeat(12,1fr);gap:3px;margin-bottom:10px;max-width:420px}
.rl{font-size:.6875rem;color:var(--muted);align-self:center}
.c{display:block;aspect-ratio:1;border-radius:3px;background:var(--wash)}
.c.l1{background:var(--l1)}.c.l2{background:var(--l2)}.c.l3{background:var(--l3)}.c.l4{background:var(--l4)}
.c.f{background:transparent}
.c.now{outline:2px solid var(--ribbon);outline-offset:1px}
.log li{display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--rule);font-size:.9375rem}
.log li:first-child{border-top:0}
.log span{flex:none;color:var(--muted);font-variant-numeric:tabular-nums}
.log b{flex:none}
.log{margin-bottom:12px}

.check{margin-top:12px}
.check li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--rule);font-size:.9375rem}
.check b{flex:none;width:3.6em;color:var(--muted)}
.check .ok b{color:var(--spine)}.check .no b{color:var(--ribbon)}
.chg{margin-top:4px}
.chg + ul{margin:4px 0 14px;padding-left:1.1em;list-style:disc;font-size:.9375rem;color:var(--muted)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;background:var(--paper);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;max-width:128px;min-height:54px;background:none;border:0;color:var(--muted);font-size:.9375rem}
.tab[aria-current="page"]{color:var(--spine);font-weight:700;box-shadow:inset 0 3px 0 var(--spine)}
@media (min-width:700px){ .v{font-size:1.125rem} .sb{padding-left:33px} }
@media (prefers-reduced-motion: no-preference){ .b,.tab,.seg{transition:opacity .12s} }
.rm.sure{color:var(--ribbon);font-weight:700}
.rd{font-size:1.0625rem;margin-bottom:12px}
.legend label{display:inline-flex;align-items:center;gap:6px}
.legend select{font:inherit;color:var(--ink);background:var(--wash);border:1px solid var(--rule);border-radius:6px;padding:2px 4px}
.shelf li{padding:14px 0;border-top:1px solid var(--rule)}
.shelf li:first-child{border-top:0;padding-top:0}
.shelf .bt{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.shelf .muted{margin:2px 0 8px}
.shelf li{overflow:hidden}
.shelf .cover{float:right;width:52px;height:auto;margin:0 0 8px 12px;border:1px solid var(--rule);border-radius:3px}
.shelf .pace{margin:0 0 8px;font-weight:600}
.shelf .bib{margin-top:-4px}
.prog{height:6px;border-radius:3px;background:var(--wash);overflow:hidden;margin:0 0 10px}
.prog i{display:block;height:100%;background:var(--spine)}
.acts{display:flex;flex-wrap:wrap;gap:4px 16px}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:.9375rem}
.chk input{width:20px;height:20px}
.notes li{padding:10px 0;border-top:1px solid var(--rule);font-size:.9375rem}
.notes li:first-child{border-top:0}
.notes .nh{color:var(--muted);font-size:.8125rem}
.og{margin:0 0 16px;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--wash);font-size:.9375rem}
.og summary{cursor:pointer;font-weight:700;color:var(--spine);min-height:32px;display:flex;align-items:center}
.og .how{list-style:decimal;margin:6px 0 4px 1.3em}
.og .how li{margin:3px 0}
.og h4{margin:14px 0 2px;font-size:.9375rem}
.og .muted{font-size:.8125rem;margin-bottom:8px}
.og .chips{margin:0 0 4px}
.og .chip{text-align:left}
.cx{color:var(--muted);font-size:.75rem}
.rec{margin:0 0 16px}
.recs{list-style:decimal;margin-left:1.4em}
.recs li{display:list-item}
.recs li>*{vertical-align:baseline}
.recs .ex{margin:0 8px}
</style>
</head>
<body>
<div class="head"><header id="sbTop" class="top"></header><div id="sbFlash" role="status" aria-live="polite"></div></div>
<main id="sbMain" class="wrap"></main>
<nav id="sbNav" class="nav" aria-label="화면 고르기"></nav>
<noscript><p style="padding:24px">이 앱은 자바스크립트가 켜져 있어야 열립니다.</p></noscript>

<script src="js/core.js?v=19"></script>
<script src="js/drive.js?v=19"></script>
<script src="js/app.js?v=19"></script>
</body>
</html>
